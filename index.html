<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="description" content="Lantern Run: keep your lantern lit through a haunted village." />
    <title>Lantern Run</title>
    <style>
      @font-face {
        font-family: 'Fredoka';
        src: url('./assets/fonts/Fredoka.ttf') format('truetype');
        font-weight: 300 700;
        font-display: block;
      }
      @font-face {
        font-family: 'Creepster';
        src: url('./assets/fonts/Creepster-Regular.ttf') format('truetype');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0614;
        overflow: hidden;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffb347;
        font: 600 20px 'Trebuchet MS', Arial, sans-serif;
        letter-spacing: 0.05em;
        animation: glow 1.4s ease-in-out infinite alternate;
      }
      @keyframes glow {
        from { opacity: 0.45; }
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="loading">Lighting the lantern…</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
